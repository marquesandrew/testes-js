<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha</title><link rel="stylesheet" href="/estilo.css"></head>
<body><main>
  <h1>Recuperar senha</h1>
  <form id="form" novalidate>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username">
    <button type="submit">Enviar link</button>
  </form>
  <p id="mensagem" hidden></p>
  <nav><a href="/">Voltar ao login</a></nav>
</main>
<script src="/app.js"></script>
<script>
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await enviar('/recuperacao', { email: $('email').value });
    if (r.ok) mostrar('ok', r.corpo.mensagem);
    else mostrar('erro', r.corpo.erro);
  });
</script></body></html>
